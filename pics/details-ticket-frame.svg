  <rect x="10" y="0" width="56" height="560" fill="url(#lace)" opacity="0.98"/>
  <rect x="834" y="0" width="56" height="560" fill="url(#lace)" opacity="0.98"/>
  <rect x="76" y="0" width="8" height="560" fill="url(#perforation)"/>
  <rect x="92" y="0" width="4" height="560" fill="url(#perforation)" opacity="0.7"/>
