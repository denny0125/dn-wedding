      <path d="M0 10 Q5 20 10 10 T20 10" fill="none" stroke="#f4b7c3" stroke-width="2.1" opacity="0.98"/>
      <path d="M10 0 Q0 5 10 10 Q20 15 10 20" fill="none" stroke="#e79aac" stroke-width="1.7" opacity="0.94"/>
    </pattern>
    <pattern id="perforation" width="6" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#232427" opacity="0.95"/>
      <circle cx="3" cy="11" r="1.3" fill="#232427" opacity="0.95"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="559" fill="url(#paper)" stroke="#d8ccb7"/>
