<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" preserveAspectRatio="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf5e8"/>
      <stop offset="100%" stop-color="#f5eedc"/>
    </linearGradient>
    <pattern id="paperDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#d7c6a7" opacity="0.4"/>
    </pattern>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2e32"/>
      <stop offset="100%" stop-color="#17181c"/>
